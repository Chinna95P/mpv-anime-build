# ===============================================
# MPV ANDROID CONFIGURATION (Optimized)
# ===============================================

--osd-level=1
--osd-font='Noto Sans'
--osd-color="#FFFFFF00"
--osd-border-color="#FF000000"
--osd-border-size=1.2
--osd-font-size=40
--osd-shadow-offset=1
--osd-shadow-color="#7F000000"
--osd-bold=no
#--osd-back-color=0/0/0/0.5
--osd-border-style=outline-and-shadow

# --- CORE VIDEO ---
vo=gpu
gpu-context=android
hwdec=mediacodec-copy

# --- CACHE ---
cache=yes
demuxer-max-bytes=128MiB
demuxer-max-back-bytes=128MiB
demuxer-mkv-subtitle-preroll=no

# ===============================================
# PROFILES (Managed by Script)
# ===============================================

[Anime-FSR]
profile-desc="Anime: FSRCNNX LineArt"
glsl-shaders-append="/storage/emulated/0/MPV/FSRCNNX_x2_8-0-4-1_LineArt.glsl"
glsl-shaders-append="/storage/emulated/0/MPV/SSimSuperRes.glsl"
glsl-shaders-append="/storage/emulated/0/MPV/SSimDownscaler.glsl"

# High-quality scaling for anime
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
# Mild debanding (SAFE for anime)
deband=yes
deband-iterations=1
deband-threshold=24
deband-range=12
deband-grain=2

[Live-Action]
profile-desc="Live Action: High-Quality"
glsl-shaders-append="/storage/emulated/0/MPV/FSRCNNX_x2_8-0-4-1.glsl"
glsl-shaders-append="/storage/emulated/0/MPV/SSimSuperRes.glsl"
glsl-shaders-append="/storage/emulated/0/MPV/SSimDownscaler.glsl"

scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
deband=no


[Battery-Saver]
profile-desc="Battery Saver (Eco Mode)"
glsl-shaders-clr
dither=no
deband=no
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
interpolation=no

# ===============================================
# AUDIO PROFILES (Spatial Sound)
# ===============================================

[Cinema-Spatial]
profile-desc="Virtual Surround + Clear Dialog"
audio-channels=7.1
af=format=channels=7.1,lavfi=[surround],lavfi=[dynaudnorm=f=75:g=25:p=0.9],lavfi=[bass=g=3]

[Standard-Audio]
profile-desc="Standard Audio"
audio-channels=auto-safe
af-clr