# ===============================================
# MPV ANDROID CONFIGURATION (Optimized)
# ===============================================

#log-file=/storage/emulated/0/mpv-log.txt

--osd-level=1
--osd-font='Noto Sans'
--osd-color="#FFFFFF00"
--osd-border-color="#FF000000"
--osd-border-size=1.2
--osd-font-size=40
--osd-shadow-offset=1
--osd-shadow-color="#7F000000"
--osd-bold=no
#--osd-back-color=0/0/0/0.5
--osd-border-style=outline-and-shadow

# --- CORE VIDEO ---

hwdec=mediacodec-copy
target-colorspace-hint=yes
tone-mapping-visualize=no
target-trc=auto
target-prim=auto
target-peak=auto
tone-mapping=st2094-40
tone-mapping-mode=auto
hdr-compute-peak=yes
linear-downscaling=no
gamut-mapping-mode=auto
hdr-compute-peak=auto
#video-sync=display-resample
#display-fps-override=60

gamma=0.0
contrast=0.0
saturation=5.0
brightness=0.0

# --- CACHE ---
cache=yes
demuxer-max-bytes=256MiB
demuxer-max-back-bytes=256MiB
demuxer-mkv-subtitle-preroll=no
vd-queue-enable=yes
ad-queue-enable=yes
vd-queue-max-bytes=300MiB
vd-queue-max-samples=10000
vd-queue-max-secs=15
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1
vd-lavc-film-grain=gpu
swapchain-depth=3

# ===============================================
# PROFILES (Managed by Script)
# ===============================================

[Anime-FSR]
profile-desc="Anime: Profile Settings Only"
# High-quality scaling for anime
scale=spline64
cscale=spline64
dscale=spline64
#scale-radius=3.1428
#scale-blur=1.05
#scale-antiring=0.6
# Mild debanding (SAFE for anime)
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=24
deband-grain=2

[Live-Action]
profile-desc="Live Action: High-Quality Settings Only"
scale=spline64
cscale=spline64
dscale=spline64
deband=no

[Battery-Saver]
profile-desc="Battery Saver (Eco Mode)"
glsl-shaders-clr
dither=no
deband=no
scale=bilinear
cscale=bilinear
dscale=bilinear
correct-downscaling=no
interpolation=no

[HDR-High-Quality]
profile-cond=p["video-params/sig-peak"] > 1
correct-downscaling=yes
gamma=0.0
contrast=0.0
saturation=0.0
brightness=0.0
tone-mapping=clip

[8K-Optimized]
profile-cond=width > 3840
profile-desc="8K Optimized (Performance)"

# [DECODER]
# Use Native Mediacodec (Not Copy). 
# "copy" kills 8K performance on Android due to slow memory bandwidth.
gpu-api=opengl
gpu-context=android
hwdec=mediacodec
vd-lavc-dr=yes

# [MEMORY]
# Disable queue to save RAM (Crucial for Android 8K)
vd-queue-enable=no

# [VISUALS]
profile=high-quality
dither=no
deband=no
interpolation=no

# [CLEANUP]
# Clear filters (Ensure no shaders run)
glsl-shaders-clr
vf=""

# ===============================================
# AUDIO PROFILES (Spatial Sound)
# ===============================================

[Cinema-Spatial]
profile-desc="Virtual Surround"
audio-channels=7.1

af=format=channels=7.1,lavfi=[surround],lavfi=[bass=g=3]

[Standard-Audio]
profile-desc="Standard Audio"
audio-channels=auto-safe
af-clr