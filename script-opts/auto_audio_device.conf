# Display-aware audio-device switching is safe to leave enabled when no mappings
# are configured. Unmatched displays leave the current audio device unchanged.
enabled=yes

# Map display identifiers to MPV audio-device names with DISPLAY=>DEVICE.
# Separate multiple mappings with two semicolons (;;). The identifiers are
# platform-specific: DP-1 (Linux), \\.\DISPLAY1 (Windows), or a display product
# name (macOS). Example:
# mappings=DP-1=>pipewire/alsa_output.example;;\\.\DISPLAY1=>wasapi/{device-id};;Color LCD=>coreaudio/device-id
mappings=

# Optional device for an unmatched display. Leave empty to preserve the current
# audio device. Set this to auto to reproduce the former fallback behavior.
fallback_device=

# Device selected when automatic switching is disabled with CTRL+a.
restore_device=auto

# Print the active connector and, when available, its readable monitor name.
# Linux resolves the name directly from DRM EDID without external commands.
log_display_name=yes
