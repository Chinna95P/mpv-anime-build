name: VirusTotal release scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan, for example v5.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: virustotal-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  scan-release-zips:
    name: Scan release ZIP files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - name: Check out the workflow helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Scan ZIP assets and update the release description
        run: python3 .github/scripts/virustotal_release_scan.py
