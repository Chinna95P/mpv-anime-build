name: VirusTotal Release Scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan (leave blank for latest release)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scan-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan release assets with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/virustotal_scan.py release

      - name: Commit VirusTotal results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/virustotal.json
          if git diff --cached --quiet; then
            echo 'No VirusTotal data changes.'
            exit 0
          fi
          git commit -m 'Update VirusTotal release results'
          git push
