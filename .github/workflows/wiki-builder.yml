name: Generate DeepWiki & Deploy Site

on:
  push:
    branches:
      - main
      - android
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      # Package your existing website into the deployment folder
      - name: Prepare Existing Site Files
        run: |
          mkdir -p ./public
          cp index.html ./public/
          cp -r screenshots ./public/ 2>/dev/null || : 

      # Generate the wikis using npx
      - name: Generate Main (PC) Docs
        env:
          DEEPWIKI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          npx -y deepwiki generate --repo https://github.com/${{ github.repository }} --branch main --output ./public/wiki/main

      - name: Generate Android Docs
        env:
          DEEPWIKI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          npx -y deepwiki generate --repo https://github.com/${{ github.repository }} --branch android --output ./public/wiki/android

      # Deploy your site + the new wikis together to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public